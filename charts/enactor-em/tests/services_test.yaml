suite: enactor-em services
templates:
  - templates/services.yaml
release:
  name: em
  namespace: em
set:
  dns.domain: test.example
tests:
  - it: renders one Service per component
    asserts:
      - hasDocuments:
          count: 5

  - it: emp Service still exposes the jmx ports from network.emp
    documentSelector:
      path: metadata.name
      value: emp
    asserts:
      - contains:
          path: spec.ports
          content:
            name: jmx4
            port: 39851
            targetPort: jmx4
            protocol: TCP

  - it: emp Service exposes the metrics port from network.emp
    documentSelector:
      path: metadata.name
      value: emp
    asserts:
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9400
            targetPort: metrics
            protocol: TCP

  - it: merges components.emp.service.extraLabels onto the emp Service
    set:
      components.emp.service.extraLabels:
        team: checkout
        prometheus.io/scrape: "true"
    documentSelector:
      path: metadata.name
      value: emp
    asserts:
      - equal:
          path: metadata.labels.team
          value: checkout
      - equal:
          path: metadata.labels["prometheus.io/scrape"]
          value: "true"

  - it: does not leak components.emp.service.extraLabels onto other Services
    set:
      components.emp.service.extraLabels:
        team: checkout
    documentSelector:
      path: metadata.name
      value: emr
    asserts:
      - isNull:
          path: metadata.labels.team

  - it: matches the rendered snapshot
    asserts:
      - matchSnapshot: {}
